[project]
name = "weathernext"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.5.0",
    "chex>=0.1.92",
    "crc32c>=2.8",
    "dask>=2026.7.1",
    "dinosaur-dycore>=1.2.1",
    "dm-haiku>=0.0.17",
    "dm-tree>=0.1.10",
    "fiddle>=0.3.0",
    "gcsfs>=2026.7.0",
    "gdm-xarray-jax",
    "google-cloud-storage>=3.13.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "jax[cuda12]>=0.11.0",
    "jraph>=0.0.6.dev0",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rtree>=1.4.1",
    "scipy>=1.18.0",
    "trimesh>=5.0.0",
    "typing-extensions>=4.16.0",
    "xarray<=2026.2.0",
    "xarray-tensorstore>=0.3.0",
    "zarr>=3.3.0",
]

[tool.uv.sources]
gdm-xarray-jax = { git = "https://github.com/google-deepmind/xarray_jax.git", rev = "v0.1.1" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
